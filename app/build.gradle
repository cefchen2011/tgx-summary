plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.tgxsummary'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.tgxsummary"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file('../keystore/tgxsum.jks')
            storePassword 'tgxsummary'
            keyAlias 'tgxsum'
            keyPassword 'tgxsummary'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }
}

dependencies {
    // Xposed API: compile-only, provided at runtime by LSPosed.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
